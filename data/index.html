<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>feed pipeline probe</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 2rem auto; max-width: 640px; padding: 0 1rem; }
    .ok { color: #0a7d32; } .bad { color: #c0392b; }
    li { margin: .3rem 0; }
  </style>
</head>
<body>
  <h2>Feed Pipeline Probe</h2>
  <div id="out">loading…</div>
  <script>
    fetch('./feed.json', { cache: 'no-store' })
      .then((r) => r.json())
      .then((d) => {
        const total = d.feeds.reduce((n, f) => n + f.items.length, 0);
        const ageMin = ((Date.now() - Date.parse(d.generatedAt)) / 60000).toFixed(1);
        let html = '<p class="ok">feed.json reachable</p><ul>';
        html += '<li>generatedAt: ' + d.generatedAt + '（' + ageMin + ' 分钟前）</li>';
        html += '<li>feeds 成功 ' + d.feeds.length + ' 个 / 失败 ' + d.errors.length + ' 个，共 ' + total + ' 条文章</li>';
        for (const f of d.feeds) html += '<li>' + f.title + '：' + f.items.length + ' 条</li>';
        for (const e of d.errors) html += '<li class="bad">失败源 ' + e.id + '：' + e.error + '</li>';
        html += '</ul>';
        document.getElementById('out').innerHTML = html;
      })
      .catch((err) => {
        document.getElementById('out').innerHTML = '<p class="bad">加载失败：' + err + '</p>';
      });
  </script>
</body>
</html>
